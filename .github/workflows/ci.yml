name: WDS MSIT CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint & Syntax Validation
        run: npm run lint

      - name: Run Automated Test Suite (Vitest)
        run: npm test

      - name: Verify Production Next.js Build
        run: npm run build
